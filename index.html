<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rebecca E. Harris</title>
  <meta name="description" content="Rebecca E. Harris. Site coming soon.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' text-anchor='middle' fill='%23fff'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="fonts/SourceSerif4Variable-Roman.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Source Serif";
      src: url("fonts/SourceSerif4Variable-Roman.woff2") format("woff2");
      font-weight: 200 900;
      font-display: swap;
    }
    :root {
      --bg: #faf8f5;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --line: #c9c4bc;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161616; --fg: #ededed; --muted: #a0a0a0; --line: #4a4a4a; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      text-align: center;
    }
    h1 {
      font-family: "Source Serif", Georgia, "Times New Roman", serif;
      font-weight: 300;
      font-size: clamp(2.5rem, 9vw, 5rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .rule {
      width: 64px;
      border: 0;
      border-top: 1px solid var(--line);
      margin: 28px auto;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Rebecca E. Harris</h1>
    <hr class="rule">
    <p>Site coming soon</p>
  </main>
</body>
</html>
